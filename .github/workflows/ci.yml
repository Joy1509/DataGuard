name: DataGuard CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-verify:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "DataGuard_StrongP@ss2024!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DataGuard_StrongP@ss2024!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'DataGuard_StrongP@ss2024!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Dependencies
        run: dotnet restore DataGuard.sln

      - name: Build Solution (Warnings As Errors)
        run: dotnet build DataGuard.sln --configuration Release --no-restore

      - name: Run Unit Tests with Coverage
        run: >
          dotnet test tests/DataGuard.Core.Tests/DataGuard.Core.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test_results.trx"
          --collect:"XPlat Code Coverage"

      - name: Initialize SQL Server Schema & Seed
        run: |
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DataGuard_StrongP@ss2024!' -C -i /workspace/db/init/001_schema.sql || true

      - name: Run Integration Tests
        run: >
          dotnet test tests/DataGuard.IntegrationTests/DataGuard.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration_results.trx"

      - name: Build CLI Application
        run: dotnet publish src/DataGuard.Cli/DataGuard.Cli.csproj -c Release -o ./publish/cli

      - name: Build React Dashboard
        working-directory: ./web
        run: |
          npm ci || npm install
          npm run build

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
